name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

  workflow_dispatch:
    inputs:
      version:
        description: Tag to publish again, such as 0.1.0
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref_name }}
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/shotor/ldap-app-password-proxy:${{ inputs.version || github.ref_name }}
            ghcr.io/shotor/ldap-app-password-proxy:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Install commitizen
        run: pip install -r .github/requirements.txt

      # after the image, so a release on GitHub always has its image
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/release-create "${{ inputs.version || github.ref_name }}"
