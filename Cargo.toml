[package]
name = "ldap-app-password-proxy"
version = "0.1.0"
edition = "2024"
license = "ISC"
description = "An LDAP proxy that checks binds against an app password's argon2id hash instead of the directory password"
repository = "https://github.com/shotor/ldap-app-password-proxy"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
base64 = "0.22.1"
futures-util = { version = "0.3.31", features = ["sink"] }
ldap3_proto = "0.8.1"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

[profile.release]
strip = true
